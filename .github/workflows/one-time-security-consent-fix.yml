name: One-time DoctorCura account privacy and consent fix

on:
  push:
    paths:
      - '.github/workflows/one-time-security-consent-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit('Missing expected block: ' + label)
              return text.replace(old, new, 1)

          # Lost-password privacy: keep success/unknown-account results on the
          # same WooCommerce page and always show the same anti-enumeration text.
          p = Path('includes/class-auth-flow.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        add_action( 'template_redirect', [ __CLASS__, 'redirect_reset_link_sent_from_account' ], 20 );\n", '')
          s = s.replace("        add_action( 'init', [ __CLASS__, 'redirect_reset_link_sent_global' ], 20 );\n", '')
          hook = "        add_filter( 'woocommerce_lost_password_confirmation_message', [ __CLASS__, 'filter_lost_password_confirmation_message' ], 999 );\n"
          anchor = "        add_filter( 'woocommerce_lost_password_redirect', [ __CLASS__, 'filter_lost_password_redirect' ], 999 );\n"
          if hook not in s:
              s = replace_once(s, anchor, anchor + hook, 'lost-password confirmation hook')
          method = """    public static function filter_lost_password_confirmation_message( string $message ): string {
        return __(
            'Aus Sicherheitsgründen bestätigen wir nicht, ob eine E-Mail-Adresse oder ein Konto registriert ist. Falls ein passendes Konto existiert, wurde eine E-Mail mit einem Link zum Zurücksetzen des Passworts gesendet. Bitte prüfen Sie auch Ihren Spam-Ordner.',
            'doctorcura-core'
        );
    }

"""
          method_anchor = "    public static function clear_notices_on_verification_page(): void {\n"
          if method not in s:
              s = replace_once(s, method_anchor, method + method_anchor, 'lost-password confirmation method')
          p.write_text(s, encoding='utf-8')

          # Medical questionnaire: add second required prescribing acknowledgement.
          p = Path('includes/extra-checkout.php')
          s = p.read_text(encoding='utf-8')
          old_field = """                        woocommerce_form_field('questionnaire_truth', [
                            'type'     => 'checkbox',
                            'label'    => __('Ich bestätige, dass alle Angaben wahrheitsgemäß sind.', 'doctorcura-core'),
                            'required' => true,
                            'class'    => ['form-row-wide', 'wa-confirmation-row', 'wa-padding-both-1rem'],
                        ], $get_field_value('questionnaire_truth'));
"""
          new_field = old_field + """
                        woocommerce_form_field('questionnaire_prescription_ack', [
                            'type'     => 'checkbox',
                            'label'    => __('I confirm that I understand that, if the doctor issues a prescription, the decision will be based on the information I provide through the validated medical questionnaire. I understand that providing false, misleading, or incomplete information may be dangerous to my health and may prevent the physician from conducting an accurate and appropriate medical assessment.', 'doctorcura-core'),
                            'required' => true,
                            'class'    => ['form-row-wide', 'wa-confirmation-row', 'wa-padding-both-1rem'],
                        ], $get_field_value('questionnaire_prescription_ack'));
"""
          s = replace_once(s, old_field, new_field, 'prescription acknowledgement checkbox')

          old_validation = """        if (!isset($_POST['questionnaire_truth'])) {
            $this->add_field_error(
                __('Bitte bestätigen Sie die Richtigkeit Ihrer Angaben.', 'doctorcura-core'),
                'questionnaire_truth'
            );
        }
"""
          new_validation = old_validation + """
        if (!isset($_POST['questionnaire_prescription_ack'])) {
            $this->add_field_error(
                __('Please confirm that you understand how the medical questionnaire is used for a prescribing decision and the risks of providing false, misleading, or incomplete information.', 'doctorcura-core'),
                'questionnaire_prescription_ack'
            );
        }
"""
          s = replace_once(s, old_validation, new_validation, 'prescription acknowledgement validation')

          old_save = """            'pregnancy_breastfeeding' => '_medical_pregnancy_breastfeeding',
"""
          new_save = old_save + """            'questionnaire_truth'          => '_medical_questionnaire_truth',
            'questionnaire_prescription_ack' => '_medical_prescription_acknowledgement',
"""
          s = replace_once(s, old_save, new_save, 'consent order meta')
          p.write_text(s, encoding='utf-8')

          # Version bump.
          p = Path('doctorcura-core.php')
          s = p.read_text(encoding='utf-8').replace('Version: 1.0.6', 'Version: 1.0.7').replace("define( 'DCAF_VERSION', '1.0.6' );", "define( 'DCAF_VERSION', '1.0.7' );")
          p.write_text(s, encoding='utf-8')
          p = Path('readme.txt')
          s = p.read_text(encoding='utf-8').replace('Stable tag: 1.0.6', 'Stable tag: 1.0.7')
          if '= 1.0.7 =' not in s:
              s = s.replace('== Changelog ==\n', '== Changelog ==\n= 1.0.7 =\n* Keeps lost-password responses on the same page with a generic anti-enumeration notice.\n* Adds a required prescribing-decision acknowledgement to the medical questionnaire and stores both confirmations on the order.\n\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

          php -l includes/class-auth-flow.php
          php -l includes/extra-checkout.php
          php -l doctorcura-core.php
          grep -F "questionnaire_prescription_ack" includes/extra-checkout.php >/dev/null
          grep -F "woocommerce_lost_password_confirmation_message" includes/class-auth-flow.php >/dev/null
          ! grep -F "add_action( 'template_redirect', [ __CLASS__, 'redirect_reset_link_sent_from_account' ]" includes/class-auth-flow.php
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/class-auth-flow.php includes/extra-checkout.php doctorcura-core.php readme.txt
          git commit -m 'Release DoctorCura Core 1.0.7 privacy and consent fixes'
          git push origin main
