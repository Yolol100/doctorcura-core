name: Package Login Privacy Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Build plugin zip
        run: |
          mkdir -p build/doctorcura-core
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/doctorcura-core/
          cd build
          zip -qr doctorcura-core.zip doctorcura-core
      - uses: actions/upload-artifact@v4
        with:
          name: doctorcura-core-login-privacy
          path: build/doctorcura-core.zip
          if-no-files-found: error
